[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "inkstitch-pyembroidery"
dynamic = ["version"]
dependencies = []
requires-python = ">= 3.8"
authors = [
  {name = "Tatarize", email = "tatarize@gmail.com"},
]
description = "Embroidery IO library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["embroidery", "file conversion"]
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Developers",
        "Programming Language :: Python :: 3.8",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Repository = "https://github.com/EmbroidePy/pyembroidery"
Issues = "https://github.com/EmbroidePy/pyembroidery/issues"